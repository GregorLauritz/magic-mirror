# Included in every location that sets its own headers: nginx drops the
# server-level add_header directives in a location that has any of its own.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# The browser talks to these APIs directly (see CLAUDE.md, "External APIs").
# Google Identity Services needs its script, iframe and stylesheet; MUI/emotion
# inject <style> elements at runtime, hence 'unsafe-inline' for styles only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://openweathermap.org; connect-src 'self' https://accounts.google.com/gsi/ https://oauth2.googleapis.com https://www.googleapis.com https://api.open-meteo.com https://geocode.maps.co https://v6.db.transport.rest; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
