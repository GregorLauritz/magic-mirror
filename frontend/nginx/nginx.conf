# The whole deployment: static files over plain HTTP on an unprivileged port.
# TLS belongs to whatever runs in front of the container (a reverse proxy, a
# tunnel, ...). Google sign-in only works on https:// origins or localhost.
server {
  listen 8080;

  root /var/www/frontend/html;
  index index.html;
  server_name _;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript
             application/x-javascript application/xml+rss
             application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  # Vite's hashed bundles never change under the same name.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
  }

  # Always revalidated, so a display picks up a new release (and its new
  # bundle names) on the next load instead of asking for deleted files.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA routing: unknown paths get the app, which routes on the client.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "healthy\n";
  }
}
