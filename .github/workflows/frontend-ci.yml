name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend-checks:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint (layer boundaries included, no warnings allowed)
        run: yarn lint
        continue-on-error: false

      - name: Check Prettier formatting
        run: yarn format:check

      - name: Run unit tests with coverage
        run: yarn test:coverage
        env:
          CI: true

      - name: Verify coverage threshold
        run: |
          echo "✅ Coverage thresholds validated by vitest (see test.coverage.thresholds in vite.config.ts)"
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "📊 Coverage Summary:"
            cat coverage/coverage-summary.json | jq '.total'
          fi

      - name: Test build process
        run: yarn build

      - name: Check build output
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "❌ Build directory is empty or doesn't exist"
            exit 1
          fi
          echo "✅ Build completed successfully"
          ls -lah dist

  # Time handling must not depend on where the browser is: the whole suite runs
  # again in zones east and west of UTC, with and without daylight saving.
  frontend-timezones:
    name: Unit tests (${{ matrix.timezone }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    strategy:
      fail-fast: false
      matrix:
        timezone: [Asia/Tokyo, America/Los_Angeles, Pacific/Auckland]

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js 24.x
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 24.x
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests in ${{ matrix.timezone }}
        run: yarn test --run
        env:
          CI: true
          TZ: ${{ matrix.timezone }}

  summary:
    name: Frontend CI Summary
    runs-on: ubuntu-latest
    needs: [frontend-checks, frontend-timezones]
    if: always()

    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.frontend-checks.result }}" == "success" ] && [ "${{ needs.frontend-timezones.result }}" == "success" ]; then
            echo "✅ All frontend checks passed!"
            exit 0
          else
            echo "❌ Frontend checks failed"
            exit 1
          fi
